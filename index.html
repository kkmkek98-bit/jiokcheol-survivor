<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>지옥철 서바이버 - 08:59 출근 대작전 v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--line:#00a84d;--bg:#0d0f14;--panel:rgba(18,22,32,.92);--bd:#2c3344}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#e8ecf3;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(6,9,15,.72);backdrop-filter:blur(3px);z-index:10;padding:20px;overflow:auto}
.ov.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 역명판 타이틀 */
.signboard{display:flex;align-items:center;background:#fbfbfb;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);margin-bottom:10px;position:relative;min-width:min(560px,92vw)}
.signboard .no{width:84px;height:84px;margin:14px;border-radius:50%;background:var(--line);color:#fff;font:900 38px 'Noto Sans KR';display:flex;align-items:center;justify-content:center}
.signboard .tx{flex:1;padding-right:24px;text-align:center}
.signboard .ko{font-family:'Black Han Sans','Noto Sans KR';font-size:44px;color:#111;line-height:1.1}
.signboard .en{font-size:13px;color:#777;letter-spacing:3px}
.signboard .bar{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#fff;font-size:12px;font-weight:700}
.signboard{padding-bottom:22px}
h2{font-family:'Black Han Sans','Noto Sans KR';font-weight:400;font-size:32px;margin-bottom:14px;color:#fff;text-align:center;letter-spacing:1px}
h2 .pill{display:inline-block;background:var(--line);border-radius:999px;padding:2px 16px;margin-right:8px;font-size:22px;vertical-align:middle}
.sub{color:#9fb3c8;margin-bottom:20px;text-align:center}
.led{font-family:'Courier New',monospace;font-weight:700;background:#050505;color:#ffa62b;text-shadow:0 0 8px #ff8a00;border:3px solid #2b2b2b;border-radius:8px;padding:6px 18px;margin:10px 0 18px;font-size:18px}
.btn{background:var(--line);border:none;color:#fff;font:700 17px 'Noto Sans KR';padding:12px 26px;margin:6px;border-radius:999px;cursor:pointer;min-width:230px;box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gray{background:#3a4152}.btn.red{background:#c0392b}.btn.gold{background:#d4a017;color:#1b1400}
.menuBtns{display:flex;flex-direction:column;align-items:center}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:1040px}
.card{width:224px;min-height:270px;background:linear-gradient(160deg,#1d2433,#121722);border:3px solid #7b8494;border-radius:16px;padding:30px 14px 14px;cursor:pointer;text-align:center;animation:pop .35s ease-out both;position:relative;transition:transform .15s;overflow:hidden}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:22px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08)}
.card:hover{transform:translateY(-8px) scale(1.03)}
.card .ic{margin:8px 0 10px;height:60px;display:flex;align-items:center;justify-content:center;font-size:48px}
.card .nm{font-size:18px;font-weight:900;margin-bottom:8px}
.card .ds{font-size:14px;color:#c7d0de;line-height:1.5}
.card .tg{font-size:12px;color:#8fc9ff;margin-top:10px}
.card .rk{position:absolute;top:3px;left:0;right:0;font-size:12px;font-weight:700;letter-spacing:1px;color:#cbd5e1}
.card .key{position:absolute;bottom:8px;right:10px;font-size:11px;color:#667}
.r-common{border-color:#8b95a5}.r-rare{border-color:#3fa0ff;box-shadow:0 0 18px #3fa0ff66}.r-legend{border-color:#ffc400;box-shadow:0 0 26px #ffc40088;background:linear-gradient(160deg,#2c2613,#14120a)}.r-curse{border-color:#ff2a2a;box-shadow:0 0 26px #ff2a2a88;background:linear-gradient(160deg,#2c1313,#140a0a)}
.r-rare .rk{color:#7cc0ff}.r-legend .rk{color:#ffd54a}.r-curse .rk{color:#ff7070}
.r-legend::after,.r-rare::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);background-size:300% 100%;animation:shine 2s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-150% 0}}
@keyframes pop{0%{transform:translateY(40px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
/* 교통카드 스타일 캐릭터 선택 */
.chars{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1180px}
.ch{width:200px;background:linear-gradient(135deg,#2a3346,#151a26);border:2px solid var(--bd);border-radius:16px;padding:16px 12px 14px;cursor:pointer;text-align:center;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.ch::before{content:'T-CARD';position:absolute;top:8px;right:10px;font-size:10px;letter-spacing:2px;color:#7f8ba0;font-weight:700}
.ch::after{content:'';position:absolute;left:14px;top:12px;width:26px;height:20px;border-radius:4px;background:linear-gradient(135deg,#e6c56a,#a8873a)}
.ch:hover{border-color:var(--line);transform:translateY(-6px)}.ch.lock{opacity:.4;cursor:not-allowed}
.ch .ic{margin:18px 0 6px;font-size:52px}.ch .nm{font-weight:900;font-size:19px;margin:4px 0}.ch .ds{font-size:13px;color:#b8c2d3;line-height:1.5}
.list{max-width:920px;width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-bottom:14px}
.li{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px;border-left:4px solid #6b7280;line-height:1.5}
.li.unseen{opacity:.35}
.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.shopi{background:linear-gradient(160deg,#1f2a22,#121812);border:2px solid #2f8f4e;border-radius:14px;padding:14px;width:190px;text-align:center;cursor:pointer;transition:transform .12s}
.shopi:hover{transform:translateY(-4px);border-color:#4ade80}.shopi.no{opacity:.4;cursor:not-allowed}
.shopi .price{display:inline-block;margin-top:8px;background:#111;color:#ffd84a;border-radius:999px;padding:2px 12px;font-weight:700}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:50}
#lbar{width:300px;height:10px;background:#222;border-radius:5px;overflow:hidden;margin-top:14px}#lfill{height:100%;width:0;background:var(--line)}
.vol{margin:12px;font-size:14px;color:#9fb3c8}
#joy{position:fixed;left:0;bottom:0;width:50%;height:60%;z-index:5;display:none}
#dashBtn{position:fixed;right:24px;bottom:40px;width:78px;height:78px;border-radius:50%;background:rgba(37,99,235,.6);border:3px solid #fff;z-index:6;display:none;font-weight:700;color:#fff;align-items:center;justify-content:center}
.small{font-size:13px;color:#9fb3c8;margin-top:8px;text-align:center;max-width:720px;line-height:1.6}
.slotm{font-size:56px;letter-spacing:12px;margin:10px;background:#050505;border:3px solid #2b2b2b;border-radius:12px;padding:8px 20px}
h2 .sub2{display:block;font:500 15px 'Noto Sans KR';color:#9fb3c8;margin-top:4px}
#lvl.augmode{background:rgba(24,16,4,.82)}
#lvl.augmode h2{color:#ffd84a}
#lvl.augmode .card{background:linear-gradient(170deg,#fbf7ec,#e9dfc4);color:#1f1a10}
#lvl.augmode .card .ds{color:#4a4232}#lvl.augmode .card .tg{color:#8a5a00}#lvl.augmode .card .rk{color:#5a4a20}
#lvl.augmode .card::before{background:repeating-linear-gradient(90deg,#c0262d 0 14px,#fbf7ec 14px 20px,#1d4ed8 20px 34px,#fbf7ec 34px 40px);height:6px;border:none}
#lvl.augmode .card::after{content:'인사팀';position:absolute;right:10px;bottom:10px;width:46px;height:46px;border:3px solid rgba(192,38,45,.55);border-radius:50%;color:rgba(192,38,45,.6);font:900 12px 'Noto Sans KR';display:flex;align-items:center;justify-content:center;transform:rotate(-15deg);background:none;animation:none}
#lvl.augmode .card.r-rare::after,#lvl.augmode .card.r-legend::after{inset:auto;right:10px;bottom:10px;background:none;animation:none}
#lvl.augmode .r-curse{background:linear-gradient(170deg,#3a1414,#1d0a0a);color:#fff}#lvl.augmode .r-curse .ds{color:#fca5a5}
#lvl.augmode .r-legend{background:linear-gradient(170deg,#fff3c4,#f2d27a)}
</style>
</head>

  <button class="btn gray" onclick="UI.credits()">크레딧</button></div>

</div>
<div class="ov" id="chars"><h2><span class="pill">승차</span>오늘의 출근러를 고르세요</h2><div class="chars" id="charList"></div><button class="btn gray" onclick="UI.show('menu')">뒤로</button></div>

<div class="ov" id="chest"><h2>🎁 보물상자!</h2><div id="slot" class="slotm"></div><div id="chestRes" class="list" style="max-width:600px"></div><button class="btn" id="chestOk" onclick="G.closeChest()">확인</button></div>
<div class="ov" id="shop"><h2><span class="pill">역내</span>편의점</h2><div class="sub" id="shopGold"></div><div class="row" id="shopList"></div><button class="btn" style="margin-top:16px" onclick="G.closeShop()">다음 역으로 ▶</button></div>
<div class="ov" id="pause"><h2>⏸ 일시정지</h2><div id="pauseInfo" class="list"></div><div class="vol">🔊 음량 <input type="range" min="0" max="100" value="40" id="volP" oninput="SFX.setVol(this.value)"></div><button class="btn" onclick="G.resume()">계속하기</button><button class="btn red" onclick="G.giveUp()">조퇴하기 (포기)</button></div>
<div class="ov" id="result"><h2 id="resTitle"></h2><div id="resBody" class="small" style="font-size:15px;color:#fff"></div><div id="resAug" class="list"></div><div id="resTips" class="small"></div><button class="btn" onclick="UI.show('menu');UI.refreshMenu()">메인으로</button></div>
<div class="ov" id="metaS"><h2>📋 인사고과</h2><div class="sub" id="metaSal"></div><div class="list" id="metaList"></div><button class="btn gray" onclick="UI.show('menu');UI.refreshMenu()">뒤로</button></div>
<div class="ov" id="codexS"><h2>📖 도감</h2><div class="row" style="margin-bottom:10px"><button class="btn gray" onclick="UI.codexTab('w')">무기</button><button class="btn gray" onclick="UI.codexTab('p')">패시브</button><button class="btn gray" onclick="UI.codexTab('a')">증강</button><button class="btn gray" onclick="UI.codexTab('s')">시너지</button></div><div class="list" id="codexList"></div><button class="btn gray" onclick="UI.show('menu')">뒤로</button></div>
<div class="ov" id="creditS"><h2>크레딧</h2><div class="small" id="creditBody" style="font-size:14px"></div><button class="btn gray" onclick="UI.show('menu')">뒤로</button></div>

function loadAssets(done){
  const list=[];for(const ch in TWEMOJI)list.push(['__em__'+ch,'data:image/png;base64,'+TWEMOJI[ch]]);ASSETS.sprites.forEach(n=>list.push(['sp_'+n,'assets/sprites/'+n+'.png']));ASSETS.tiles.forEach(n=>list.push(['tl_'+n,'assets/tiles/'+n+'.png']));
  let c=0;const fin=()=>{c++;const p=Math.round(c/list.length*100);document.getElementById('lfill').style.width=p+'%';document.getElementById('lpct').textContent=p+'%';if(c===list.length)setTimeout(done,200);};
  if(!list.length)return done();
  list.forEach(([k,src])=>{let ok=false;const im=new Image();const to=setTimeout(()=>{if(!ok){ok=true;fin();}},1500);
    im.onload=()=>{if(ok)return;ok=true;clearTimeout(to);if(k.startsWith('__em__'))EIMG[k.slice(6)]=im;else IMG[k]=im;fin();};im.onerror=()=>{if(ok)return;ok=true;clearTimeout(to);fin();};im.src=src;});
}

const SFX={ctx:null,vol:.4,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  setVol(v){this.vol=v/100;['volM','volP'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=v;});},
  tone(f,d,type,v,slide){if(!this.ctx||this.vol<=0)return;try{const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime((v||.1)*this.vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d);}catch(e){}},
  _last:{},
  play(n){const now=performance.now();if(this._last[n]&&now-this._last[n]<50)return;this._last[n]=now;
    switch(n){case'hit':this.tone(220,.05,'square',.03,110);break;case'kill':this.tone(500,.06,'triangle',.04,900);break;
    case'lvl':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.12,'square',.08),i*70));break;
    case'hurt':this.tone(150,.15,'sawtooth',.1,60);break;case'boss':[196,185,175].forEach((f,i)=>setTimeout(()=>this.tone(f,.4,'sawtooth',.12),i*250));break;
    case'ding':this.tone(880,.3,'sine',.12);setTimeout(()=>this.tone(659,.5,'sine',.12),300);break;
    case'coin':this.tone(988,.05,'square',.05);setTimeout(()=>this.tone(1319,.08,'square',.05),50);break;
    case'boom':this.tone(120,.25,'sawtooth',.1,40);break;case'chest':[392,523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,.1,'triangle',.08),i*60));break;}
  }
};

  // 이벤트
  this.updEvent(dt);
  // 스폰
  this.spawn(dt);

  this.updPlayer(dt);
  // 무기
  this.updWeapons(dt);
  GRID.build(E);
  this.updPets(dt);this.updInst(dt);
  this.updProj(dt);this.updZones(dt);this.updEnemies(dt);this.updEProj(dt);this.updHaz(dt);this.updGems(dt);this.updAugTimers(dt);

  NUMS.sweep(n=>{n.life-=dt;n.y-=40*dt;return n.life>0;});
  if(P.hurtFlash>0)P.hurtFlash-=dt;

 // ---- 플레이어
 updPlayer(dt){const s=P.s;let mx=0,my=0;
  if(KEYS.w||KEYS.arrowup)my--;if(KEYS.s||KEYS.arrowdown)my++;if(KEYS.a||KEYS.arrowleft)mx--;if(KEYS.d||KEYS.arrowright)mx++;
  if(JOY.on){mx=JOY.dx;my=JOY.dy;}
  if(this.bot){mx=this.bot.x;my=this.bot.y;}
  const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;}
  P.moved=l>.1;if(P.moved){P.face={x:mx/(l>1?1:l||1),y:my/(l>1?1:l||1)};const fl=Math.hypot(P.face.x,P.face.y)||1;P.face.x/=fl;P.face.y/=fl;}
  let spd=s.spd;if(P.flags.lowHpSpd&&P.hp<P.s.maxhp*.3)spd*=1.2;if(P.spdBuff>0){spd*=1.3;P.spdBuff-=dt;}
  if(P.slowed>0){spd*=.6;P.slowed-=dt;}if(P.flags.countdown&&this.clock>=3000)spd*=1.15;
  if(this.event&&this.event.type==='aircon'&&Math.sign(P.x-this.event.cx||1)===this.event.side)spd*=.7;

  if(P.dashT>0){P.dashT-=dt;const ds=900;if(P.flags.elevator)for(const e of GRID.query(P.x,P.y,40,[]))this.knock(e,P.x,P.y,200);const ox=P.x,oy=P.y;P.x+=P.dashV.x*ds*dt;P.y+=P.dashV.y*ds*dt;if(P.flags.dashBomb&&Math.random()<.5)this.explode(P.x,P.y,45,20*this.dmgMul(),'#ff9');}
  else{P.x+=mx*spd*dt;P.y+=my*spd*dt;if(P.flags.walkXp&&P.moved){P.walk+=spd*dt;if(P.walk>=1000){P.walk-=1000;GEMS.push({x:P.x+rnd(-30,30),y:P.y+rnd(-30,30),v:5,k:'xp'});}}}

  // 출근 러시

 },

 // ---- 피해

 // ================= 렌더 =================
 draw(){ctx.setTransform(1,0,0,1,0,0);const st=STAGES[this.stage]||STAGES[0];
  if(!P||this.state==='menu'||(this.state!=='play'&&!P.s)){ctx.fillStyle='#0d0f14';ctx.fillRect(0,0,VW,VH);this.drawMenuBg();return;}
  let sx=0,sy=0;if(this.shake>0){sx=rnd(-6,6);sy=rnd(-6,6);}
  const cx=Math.round(P.x-VW/2+sx);let cy=Math.round(P.y-VH/2+sy);if(VH<2200)cy=clamp(cy,-1150,1150-VH);
  ctx.fillStyle='#0d0f14';ctx.fillRect(0,0,VW,VH);
  ctx.translate(-cx,-cy);
  STN.draw(cx,cy,this.stage,this.real);
  // 냉방 이벤트
  if(this.event&&this.event.type==='aircon'){if(this.event.cx===undefined)this.event.cx=P.x;const ex=this.event.cx;ctx.fillStyle='rgba(120,180,255,.12)';ctx.fillRect(this.event.side>0?ex:ex-5000,cy,5000,VH);ctx.fillStyle='rgba(255,120,60,.12)';ctx.fillRect(this.event.side>0?ex-5000:ex,cy,5000,VH);}
  // 위험지대
  for(const h of HAZ){if(h.type==='slow'){ctx.fillStyle='rgba(150,80,200,.25)';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill();}
   else if(h.type==='ring'){ctx.strokeStyle='rgba(255,150,50,.8)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.stroke();}
   else if(h.type==='meeting'){ctx.fillStyle=h.arm>0?'rgba(255,0,0,.15)':'rgba(255,0,0,.4)';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('📋 회의실',h.x,h.y);}
   else if(h.type==='door'){ctx.strokeStyle='rgba(100,200,255,.6)';ctx.setLineDash([6,6]);ctx.lineWidth=3;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#9cf';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('문 열림',h.x,h.y-h.r-4);}}
  for(const z of ZONES){if(z.wave){ctx.strokeStyle=z.col;ctx.lineWidth=6;ctx.globalAlpha=Math.max(0,z.life/z.max);ctx.beginPath();ctx.arc(z.x,z.y,Math.max(1,z.r),0,7);ctx.stroke();ctx.globalAlpha=1;}
   else if(z.bomb){ctx.fillStyle=z.col;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();drawSprite(null,z.ic,z.x,z.y,22);}
   else{ctx.fillStyle=z.col;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();}}
  // 보석
  for(const g of GEMS){if(g.x<cx-20||g.x>cx+VW+20||g.y<cy-20||g.y>cy+VH+20)continue;
   if(g.k==='xp'){ctx.fillStyle=g.big?'#f5f':g.v>=10?'#f44':g.v>=3?'#4f8':'#4af';ctx.beginPath();ctx.moveTo(g.x,g.y-6);ctx.lineTo(g.x+5,g.y);ctx.lineTo(g.x,g.y+6);ctx.lineTo(g.x-5,g.y);ctx.fill();}
   else drawSprite(null,{gold:'🪙',heal:'🍞',chest:'🎁'}[g.k],g.x,g.y,g.k==='chest'?30:18);}
  // 적
  for(const e of E){if(e.x<cx-60||e.x>cx+VW+60||e.y<cy-60||e.y>cy+VH+60)continue;
   if(e.elite&&!e.boss){ctx.fillStyle='rgba(255,200,0,.25)';ctx.beginPath();ctx.arc(e.x,e.y,e.r+6,0,7);ctx.fill();}
   if(e.ally>0){ctx.fillStyle='rgba(0,255,120,.25)';ctx.beginPath();ctx.arc(e.x,e.y,e.r+6,0,7);ctx.fill();}
   if(e.charm>0){ctx.fillStyle='rgba(255,100,200,.3)';ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,7);ctx.fill();}
   if(e.d.holder){ctx.strokeStyle='rgba(180,180,180,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,160,0,7);ctx.stroke();}
   ctx.globalAlpha=e.hitT>0?.5:1;drawSprite(e.sp,e.ic,e.x,e.y,e.r*2.6,e.x>P.x,(e.stun>0?0:this.real*1.6+e.ph));ctx.globalAlpha=1;
