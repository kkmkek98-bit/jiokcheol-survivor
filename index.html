:root{--line:#00a84d;--bg:#0d0f14;--panel:rgba(18,22,32,.92);--bd:#2c3344}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;color:#e8ecf3;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(6,9,15,.72);backdrop-filter:blur(3px);z-index:10;padding:20px;overflow:auto}
.ov.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 역명판 타이틀 */
.signboard{display:flex;align-items:center;background:#fbfbfb;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);margin-bottom:10px;position:relative;min-width:min(560px,92vw)}
.signboard .no{width:84px;height:84px;margin:14px;border-radius:50%;background:var(--line);color:#fff;font:900 38px 'Noto Sans KR';display:flex;align-items:center;justify-content:center}
.signboard .tx{flex:1;padding-right:24px;text-align:center}
.signboard .ko{font-family:'Black Han Sans','Noto Sans KR';font-size:44px;color:#111;line-height:1.1}
.signboard .en{font-size:13px;color:#777;letter-spacing:3px}

.card .nm{font-size:18px;font-weight:900;margin-bottom:8px}
.card .ds{font-size:14px;color:#c7d0de;line-height:1.5}
.card .tg{font-size:12px;color:#8fc9ff;margin-top:10px}

function loadAssets(done){
  const list=[];list.push(['__atlas__','assets/emoji_atlas.png']);ASSETS.sprites.forEach(n=>list.push(['sp_'+n,'assets/sprites/'+n+'.png']));ASSETS.tiles.forEach(n=>list.push(['tl_'+n,'assets/tiles/'+n+'.png']));
  let c=0;const fin=()=>{c++;const p=Math.round(c/list.length*100);document.getElementById('lfill').style.width=p+'%';document.getElementById('lpct').textContent=p+'%';if(c===list.length)setTimeout(done,200);};
  if(!list.length)return done();
  list.forEach(([k,src])=>{let ok=false;const im=new Image();const to=setTimeout(()=>{if(!ok){ok=true;fin();}},k==='__atlas__'?8000:1500);
    im.onload=()=>{if(ok)return;ok=true;clearTimeout(to);if(k==='__atlas__'){for(const ch in EMOJI_IDX){const i=EMOJI_IDX[ch];const c=document.createElement('canvas');c.width=c.height=ATLAS_S;c.getContext('2d').drawImage(im,(i%ATLAS_COLS)*ATLAS_S,Math.floor(i/ATLAS_COLS)*ATLAS_S,ATLAS_S,ATLAS_S,0,0,ATLAS_S,ATLAS_S);EIMG[ch]=c;}for(const k2 in EC)delete EC[k2];}else IMG[k]=im;fin();};im.onerror=()=>{if(ok)return;ok=true;clearTimeout(to);fin();};im.src=src;});
}

const SFX={ctx:null,vol:.4,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},
  setVol(v){this.vol=v/100;['volM','volP'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=v;});},
  tone(f,d,type,v,slide){if(!this.ctx||this.vol<=0)return;try{const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime((v||.1)*this.vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d);}catch(e){}},
  _last:{},
  play(n){const now=performance.now();if(this._last[n]&&now-this._last[n]<50)return;this._last[n]=now;
    switch(n){case'hit':this.tone(220,.05,'square',.03,110);break;case'kill':this.tone(500,.06,'triangle',.04,900);break;
    case'lvl':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.12,'square',.08),i*70));break;
    case'hurt':this.tone(150,.15,'sawtooth',.1,60);break;case'boss':[196,185,175].forEach((f,i)=>setTimeout(()=>this.tone(f,.4,'sawtooth',.12),i*250));break;
    case'ding':this.tone(880,.3,'sine',.12);setTimeout(()=>this.tone(659,.5,'sine',.12),300);break;
    case'coin':this.tone(988,.05,'square',.05);setTimeout(()=>this.tone(1319,.08,'square',.05),50);break;
    case'boom':this.tone(120,.25,'sawtooth',.1,40);break;case'chest':[392,523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,.1,'triangle',.08),i*60));break;}
  }
};

const EC={};
function emo(ch,size){const k=ch+'|'+size;if(EC[k])return EC[k];const c=document.createElement('canvas');const s=Math.ceil(size*1.3);c.width=c.height=s;const x=c.getContext('2d');const ti=EIMG[ch];if(ti){x.imageSmoothingEnabled=true;x.drawImage(ti,(s-size)/2,(s-size)/2,size,size);EC[k]=c;return c;}x.font=size+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,s/2,s/2+size*.05);EC[k]=c;return c;}
function drawSprite(key,ch,x,y,size,flip,phase,white){if(key&&LOOK[key]&&!IMG['sp_'+key]){drawLook(key,x,y,size,flip,phase,white);return;}const im=key&&IMG['sp_'+key];if(im){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-size/2,-size/2,size,size);ctx.restore();}else{const c=emo(ch,Math.round(size));ctx.drawImage(c,x-c.width/2,y-c.height/2);}}

 // ---- 레벨업 카드
 rollRarity(force){const L=P.s.luck+(P.flags.invest?Math.floor(P.gold/100):0);let r=Math.random()*100;const leg=14+L*.1,cur=3,rare=33+L*.1;let t=r<cur?'curse':r<cur+leg?'legend':r<cur+leg+rare?'rare':'common';

 augOpt(used){const owned=new Set(P.augs.map(a=>a.id));for(let k=0;k<20;k++){const r=this.rollRarity();const pool=AUGS.filter(a=>a.r===r&&!owned.has(a.id)&&!used.has('a'+a.id)&&(!a.w||Math.random()<a.w));if(pool.length){const a=pick(pool);return{k:'aug',a};}}return null;},
 buildOptions(augOnly){const s=P.s;const opts=[];const used=new Set();

  if(P.passives.length<s.maxP)for(const id in PASSIVES)if(!P.passives.find(p=>p.id===id))pool.push({k:'pnew',id});

 levelUp(){this.state='lvl';this._ao=false;this._memo=false;document.documentElement.style.setProperty('--line',LINE[this.stage].col);SFX.play('lvl');this.opts=this.buildOptions(false);

 renderCards(){const box=document.getElementById('cardList');box.innerHTML='';

 // ================= 렌더 =================
 draw(){ctx.setTransform(1,0,0,1,0,0);const st=STAGES[this.stage]||STAGES[0];
  if(!P||this.state==='menu'||(this.state!=='play'&&!P.s)){ctx.fillStyle='#0d0f14';ctx.fillRect(0,0,VW,VH);this.drawMenuBg();return;}
  let sx=0,sy=0;if(this.shake>0){const amp=Math.min(12,3+this.shake*16);sx=rnd(-amp,amp);sy=rnd(-amp,amp);}
  const cx=Math.round(P.x-VW/2+sx);let cy=Math.round(P.y-VH/2+sy);if(VH<2200)cy=clamp(cy,-1150,1150-VH);
  ctx.fillStyle='#0d0f14';ctx.fillRect(0,0,VW,VH);
  ctx.translate(-cx,-cy);
  STN.draw(cx,cy,this.stage,this.real);
  // 냉방 이벤트
  if(this.event&&this.event.type==='aircon'){if(this.event.cx===undefined)this.event.cx=P.x;const ex=this.event.cx;ctx.fillStyle='rgba(120,180,255,.12)';ctx.fillRect(this.event.side>0?ex:ex-5000,cy,5000,VH);ctx.fillStyle='rgba(255,120,60,.12)';ctx.fillRect(this.event.side>0?ex-5000:ex,cy,5000,VH);}
  // 위험지대
  for(const h of HAZ){if(h.type==='slow'){ctx.fillStyle='rgba(150,80,200,.25)';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill();}
   else if(h.type==='ring'){ctx.strokeStyle='rgba(255,150,50,.8)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.stroke();}
   else if(h.type==='meeting'){ctx.fillStyle=h.arm>0?'rgba(255,0,0,.15)':'rgba(255,0,0,.4)';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('📋 회의실',h.x,h.y);}
   else if(h.type==='drop'){const k=clamp(1-h.arm/.9,0,1);ctx.fillStyle='rgba(249,115,22,'+(h.arm>0?.15+k*.25:.5)+')';ctx.beginPath();ctx.arc(h.x,h.y,h.r*(h.arm>0?k:1),0,7);ctx.fill();ctx.strokeStyle='rgba(249,115,22,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.stroke();if(h.arm>0)drawSprite(null,'🟫',h.x,h.y-80*(1-k),26);}
   else if(h.type==='door'){ctx.strokeStyle='rgba(100,200,255,.6)';ctx.setLineDash([6,6]);ctx.lineWidth=3;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#9cf';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('문 열림',h.x,h.y-h.r-4);}}
  for(const z of ZONES){if(z.wave){ctx.strokeStyle=z.col;ctx.lineWidth=6;ctx.globalAlpha=Math.max(0,z.life/z.max);ctx.beginPath();ctx.arc(z.x,z.y,Math.max(1,z.r),0,7);ctx.stroke();ctx.globalAlpha=1;}
   else if(z.bomb){ctx.fillStyle=z.col;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();drawSprite(null,z.ic,z.x,z.y,22);}
   else{ctx.fillStyle=z.col;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();}}
  // 보석
  for(const g of GEMS){if(g.x<cx-20||g.x>cx+VW+20||g.y<cy-20||g.y>cy+VH+20)continue;
   if(g.k==='xp'){ctx.fillStyle=g.big?'#f5f':g.v>=10?'#f44':g.v>=3?'#4f8':'#4af';ctx.beginPath();ctx.moveTo(g.x,g.y-6);ctx.lineTo(g.x+5,g.y);ctx.lineTo(g.x,g.y+6);ctx.lineTo(g.x-5,g.y);ctx.fill();}
   else drawSprite(null,{gold:'🪙',heal:'🍞',chest:'🎁'}[g.k],g.x,g.y,g.k==='chest'?30:18);}

  ctx.textAlign='center';let ty=VH-118;for(const f of FX)if(f.type==='toast'){ctx.globalAlpha=Math.min(1,f.life);ctx.font='bold 15px sans-serif';const w=ctx.measureText(f.txt).width+36;ctx.fillStyle='rgba(12,15,22,.9)';rr(VW/2-w/2,ty-21,w,30,15);ctx.fill();ctx.strokeStyle=L.col;ctx.lineWidth=2;rr(VW/2-w/2,ty-21,w,30,15);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(f.txt,VW/2,ty);ty-=36;ctx.globalAlpha=1;}
 },
 drawMenuBg(){const t=performance.now()/1000;this._mx=(this._mx||0)+1.2;STN.update(1/60);const cx=Math.round(this._mx),cy=Math.round(-800-VH*.1);ctx.save();ctx.translate(-cx,-cy);STN.draw(cx,cy,Math.floor(t/8)%5,t);
  for(let i=0;i<14;i++){const x=cx+((i*173+t*40*(1+i%3))%(VW+100))-50,y=-560+((i*97)%Math.max(100,cy+VH+560))*.4+40;drawLook(['passenger','backpacker','cutter','phone','hiker1','manspread','flyer'][i%7],x,y,34,false,t*1.6+i*.3);}ctx.globalAlpha=1;ctx.restore();ctx.fillStyle='rgba(5,8,14,.45)';ctx.fillRect(0,0,VW,VH);}
};


// ================= UI =================
const UI={
 ids:['menu','chars','lvl','chest','shop','pause','result','metaS','codexS','creditS','tut'],
 show(id){this.ids.forEach(i=>document.getElementById(i).classList.toggle('on',i===id));if(id==='menu')G.state='menu';},
 hideAll(){this.ids.forEach(i=>document.getElementById(i).classList.remove('on'));},
 rcol(r){return{common:'#9aa',rare:'#3fa0ff',legend:'#ffc400',curse:'#ff2a2a'}[r];},
 refreshMenu(){document.documentElement.style.setProperty('--line','#00a84d');document.getElementById('mSal').textContent=META.salary;},
 setDiff(k){G.diff=k;META.diff=k;saveMeta();this.renderDiff();},
 renderDiff(){const r=document.getElementById('diffRow');r.innerHTML='';for(const k in DIFFS){const D=DIFFS[k];const b=document.createElement('div');b.className='diffBtn'+((G.diff||'normal')===k?' on':'')+(k==='hell'?' hell':'');b.innerHTML=`<b>${D.ic} ${D.nm}</b><span>${D.ds}</span>`;b.onclick=()=>this.setDiff(k);r.appendChild(b);}},
 tutI:0,
 TUT:[{ic:'🕹️',t:'이동만 하세요',d:'<b>WASD / 방향키</b>(모바일은 왼쪽 화면 드래그)로 움직이면 돼요.<br>공격은 <b>자동</b>으로 나가요. 적에게 닿지 않게 피해 다니세요!'},
  {ic:'💎',t:'보석을 먹으면 레벨업',d:'적을 잡으면 떨어지는 <b>파란 보석</b>을 주우세요.<br>레벨업하면 <b>무기·패시브</b> 카드 중 하나를 골라요.<br>무기 Lv8 + 짝 패시브가 있으면 보물상자에서 <b>진화</b>!'},
  {ic:'📋',t:'인사발령 통지서 = 증강',d:'5레벨마다, 역에 도착할 때, 보스를 잡을 때<br><b>인사발령 통지서</b>가 와요. 게임 규칙을 바꾸는 <b>증강</b>을 골라요.<br>같은 태그를 모으면 오른쪽에 <b>시너지</b>가 켜져요.'},
  {ic:'⏰',t:'09:00 전에 회사 도착!',d:'신도림 → 사당 → 강남 → 잠실 → 회사 로비.<br>상단 노선도와 시계를 보세요. <b>09:00까지 버티거나 팀장님을 격파</b>하면 정시 출근!<br><span style="color:#9fb3c8">ESC 일시정지 · Space 대시(해금 시) · H 판정 보기</span>'}],
 tutStart(){this.tutI=0;this.tutRender();this.show('tut');},
 tutRender(){const s=this.TUT[this.tutI];document.getElementById('tutIc').textContent=s.ic;document.getElementById('tutT').textContent=s.t;document.getElementById('tutD').innerHTML=s.d;document.getElementById('tutStep').textContent='STEP '+(this.tutI+1)+' / '+this.TUT.length;document.getElementById('tutNext').textContent=this.tutI===this.TUT.length-1?'출근 시작! 🚇':'다음 ▶';document.getElementById('tutDots').innerHTML=this.TUT.map((_,i)=>'<i class="'+(i===this.tutI?'on':'')+'"></i>').join('');const b=document.querySelector('.tutBox');if(b){b.classList.remove('flashIn');void b.offsetWidth;b.classList.add('flashIn');}},
 tutNext(){if(this.tutI<this.TUT.length-1){this.tutI++;this.tutRender();}else this.tutEnd();},
 tutEnd(){META.tutDone=true;saveMeta();this.hideAll();G.state='play';},
 charSel(){G.diff=G.diff||META.diff||'normal';this.renderDiff();const box=document.getElementById('charList');box.innerHTML='';
  CHARS.forEach((c,i)=>{const lock=c.lock&&!META.mz;const d=document.createElement('div');d.className='ch'+(lock?' lock':'');d.innerHTML=`<div class="ic"><img src="${lookURL(c.sp,1.8)}" style="height:130px"></div><div class="nm">${c.nm}</div><div class="ds">${c.ds}<br>시작 무기: ${WEAPONS[c.w].ic} ${WEAPONS[c.w].nm}<br>체력 ${c.hp}</div>${lock?'<div style="color:#f88;margin-top:6px">🔒 300만원으로 해금</div>':''}`;
   d.onclick=()=>{if(lock)return;G.start(i);};box.appendChild(d);});this.show('chars');},
 meta(){const box=document.getElementById('metaList');box.innerHTML='';document.getElementById('metaSal').textContent='💰 보유 연봉: '+META.salary+'만원';
  for(const k in META_UPS){const u=META_UPS[k];const lv=META.ups[k]||0;const cost=u.cost*(lv+1);const d=document.createElement('div');d.className='li';d.style.cursor='pointer';d.innerHTML=`${u.ic} <b>${u.nm}</b> Lv${lv}/${u.max}<br>${u.ds}<br><span style="color:#ffd84a">${lv>=u.max?'MAX':cost+'만원'}</span>`;
   d.onclick=()=>{if(lv>=u.max||META.salary<cost)return;META.salary-=cost;META.ups[k]=lv+1;saveMeta();this.meta();SFX.play('coin');};box.appendChild(d);}
  const d=document.createElement('div');d.className='li';d.style.cursor='pointer';d.style.borderColor='#ffc400';d.innerHTML=`😎 <b>해외파 MZ 해금</b><br>증강 선택지 +1장<br><span style="color:#ffd84a">${META.mz?'해금됨':'300만원'}</span>`;
  d.onclick=()=>{if(META.mz||META.salary<300)return;META.salary-=300;META.mz=true;saveMeta();this.meta();SFX.play('lvl');};box.appendChild(d);
  this.show('metaS');},
 codex(){this.show('codexS');this.codexTab('w');},
 codexTab(t){const box=document.getElementById('codexList');let h='';const C=META.codex;
  if(t==='w')for(const id in WEAPONS){const W=WEAPONS[id];const s=C.w.includes(id);h+=`<div class="li ${s?'':'unseen'}">${s?W.ic+' <b>'+W.nm+'</b><br>'+W.ds+'<br>진화: '+PASSIVES[W.evo.with].ic+' + Lv8 → '+W.evo.ic+' '+W.evo.nm:'❓ ???'}</div>`;}
  if(t==='p')for(const id in PASSIVES){const p=PASSIVES[id];const s=C.p.includes(id);h+=`<div class="li ${s?'':'unseen'}">${s?p.ic+' <b>'+p.nm+'</b><br>'+p.ds:'❓ ???'}</div>`;}
  if(t==='a')AUGS.forEach(a=>{const s=C.a.includes(a.id);h+=`<div class="li ${s?'':'unseen'}" style="border-color:${this.rcol(a.r)}">${s?a.ic+' <b>'+a.nm+'</b><br>'+a.ds:'❓ ??? ('+{common:'일반',rare:'희귀',legend:'전설',curse:'저주'}[a.r]+')'}</div>`;});
  if(t==='s')for(const k in SYN){const S=SYN[k];const s=C.s.includes(k);h+=`<div class="li ${s?'':'unseen'}">${S.ic} <b>${S.nm}</b><br>${S.th[0]}개: ${S.ds[0]}<br>${S.th[1]}개: ${S.ds[1]}</div>`;}
  const seenN={w:C.w.length+'/'+Object.keys(WEAPONS).length,p:C.p.length+'/'+Object.keys(PASSIVES).length,a:C.a.length+'/'+AUGS.length,s:C.s.length+'/'+Object.keys(SYN).length}[t];
  box.innerHTML=`<div class="li" style="grid-column:1/-1;text-align:center">수집 ${seenN}</div>`+h;},
 credits(){document.getElementById('creditBody').innerHTML=CREDITS_TXT;this.show('creditS');}
};

// ================= 루프 =================
let last=0;
function loop(t){const dt=(t-last)/1000||0;last=t;try{G.update(dt);G.draw();}catch(err){console.error(err);}requestAnimationFrame(loop);}
loadMeta();
if(!window.__TEST){loadAssets(()=>{document.getElementById('loading').style.display='none';UI.refreshMenu();requestAnimationFrame(loop);});}
</script>
